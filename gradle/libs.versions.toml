# --- AI Keyboard ---
# FORK(S0-modules): entries below were added by the fork (see docs/FORK_PATCHES.md). Keep them in this block.
javax-inject = "1"
# Lint API for :lint-rules. Must stay at AGP version + 23 (AGP 8.12.0 -> lint 31.12.0).
android-lint = "31.12.0"
junit4 = "4.13.2"
# :core:ads consent (Google UMP). 4.0.0 is the latest release on Google Maven (checked 2026-10-18)
google-ump = "4.0.0"
# FORK(S1-policy): :core:datastore (latest stable on Google Maven / Maven Central, checked 2026-10-18)
androidx-datastore = "1.2.1"
# Moving this version means re-checking the android-all pin (14-robolectric-...) in gradle/robolectric-offline.gradle.kts
robolectric = "4.17"
turbine = "1.2.1"
# FORK(S1-whisper): Whisper model download (WorkManager: latest stable, checked 2026-10-19) and its test server
# (MockWebServer 4.12.0: 5.x pulls okhttp-android, which needs compileSdk 37)
androidx-work = "2.12.0"
mockwebserver = "4.12.0"
# FORK(S2-mlkit): on-device translation and language ID (latest on Google Maven, checked 2026-10-25)
mlkit-translate = "17.0.3"
mlkit-language-id = "17.0.6"
# FORK(S2-translate): AndroidJUnitRunner for the :core:translate-mlkit latency test (matches espresso 3.6.1)
androidx-test-runner = "1.6.1"



